[project]
name = "call-help-backend"
version = "0.1.0"
description = "Copilote d'appel en temps réel : scénario, métriques, émotions, conseils."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "websockets>=13",  # transcription en direct (ElevenLabs Scribe v2 Realtime)
]

[project.optional-dependencies]
llm = ["anthropic>=2.5"]
voices = ["elevenlabs==2.76.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
